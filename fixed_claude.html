<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background-color: #1a1a1a;
            color: #e5e5e5;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background-color: #262626;
            border-right: 1px solid #404040;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #404040;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 16px;
        }

        .back-arrow {
            width: 20px;
            height: 20px;
            opacity: 0.7;
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            color: #ff6b35;
            font-size: 14px;
            padding: 8px 0;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .new-chat-btn:hover {
            opacity: 0.8;
        }

        .plus-icon {
            width: 16px;
            height: 16px;
            background-color: #ff6b35;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
        }

        .sidebar-nav {
            padding: 16px;
            border-bottom: 1px solid #404040;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            color: #b3b3b3;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item:hover {
            color: #fff;
        }

        .nav-icon {
            width: 16px;
            height: 16px;
            opacity: 0.7;
        }

        .sidebar-content {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 12px;
            color: #808080;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .recent-items {
            min-height: 20px;
        }

        .recent-item {
            padding: 8px 0;
            color: #b3b3b3;
            font-size: 13px;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-item:hover {
            color: #fff;
        }

        .empty-state {
            padding: 8px 0;
            text-align: center;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid #404040;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            background-color: #ff6b35;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: white;
        }

        .user-details {
            flex: 1;
        }

        .user-name {
            font-size: 14px;
            color: #fff;
            font-weight: 500;
        }

        .user-plan {
            font-size: 12px;
            color: #808080;
        }

        .chevron-down {
            width: 16px;
            height: 16px;
            opacity: 0.5;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #1a1a1a;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            position: relative;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 40px;
        }

        .chat-container {
            display: none;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
        }

        .chat-container.active {
            display: flex;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px;
            margin-bottom: 20px;
            height: calc(100vh - 200px);
            min-height: 0;
            scrollbar-width: thin;
            scrollbar-color: #404040 #262626;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #262626;
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #404040;
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .message {
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background-color: #ff6b35;
            color: white;
        }

        .message.assistant .message-avatar {
            background-color: #4a90e2;
            color: white;
        }

        .message-content {
            max-width: 70%;
            background-color: #262626;
            border-radius: 12px;
            padding: 16px;
            color: #e5e5e5;
            line-height: 1.5;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }
        .message.assistant .message-content {
            padding: 0; /* Remove padding for container of artifacts */
        }
        .message-text-part {
            padding: 16px;
            white-space: pre-wrap;
        }

        .message.user .message-content {
            background-color: #ff6b35;
            color: white;
            padding: 16px; /* Restore padding for user messages */
        }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            color: #808080;
            font-style: italic;
            padding: 16px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background-color: #808080;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .greeting {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            font-size: 32px;
            font-weight: 400;
            color: #fff;
        }

        .sun-icon {
            width: 32px;
            height: 32px;
            color: #ff6b35;
        }

        .search-container {
            width: 100%;
            max-width: 600px;
            position: relative;
            margin-bottom: 20px;
        }

        .chat-container .search-container {
            position: sticky;
            bottom: 0;
            background-color: #1a1a1a;
            padding: 20px 0;
            margin: 0;
            max-width: none;
        }

        .search-input {
            width: 100%;
            padding: 16px 120px 16px 16px;
            background-color: #262626;
            border: 1px solid #404040;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            resize: none;
            min-height: 50px;
            max-height: 150px;
            font-family: inherit;
        }

        .search-input:focus {
            border-color: #ff6b35;
        }

        .search-input::placeholder {
            color: #808080;
        }

        .search-actions {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 4px;
        }

        .search-btn {
            padding: 8px;
            background: none;
            border: none;
            color: #808080;
            cursor: pointer;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .search-btn:hover {
            background-color: #404040;
        }

        .send-btn {
            padding: 8px;
            background-color: #ff6b35;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 6px;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            background-color: #e55a2b;
        }

        .send-btn:disabled {
            background-color: #404040;
            cursor: not-allowed;
        }

        .model-selector {
            align-self: flex-end;
            margin-bottom: 20px;
            margin-right: 60px;
        }

        .model-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            color: #b3b3b3;
            font-size: 14px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .model-btn:hover {
            background-color: #262626;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background-color: #262626;
            border: 1px solid #404040;
            border-radius: 8px;
            color: #e5e5e5;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .action-btn:hover {
            background-color: #333;
            border-color: #555;
            transform: translateY(-1px);
        }

        .action-icon {
            width: 16px;
            height: 16px;
            opacity: 0.8;
        }
        
        /* Artifact Canvas Styles */
        .artifact-canvas {
            background-color: #0d0d0d;
            border: 1px solid #404040;
            border-radius: 8px;
            margin: 16px;
            overflow: hidden;
        }

        .artifact-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2a2a2a;
            padding: 8px 12px;
            border-bottom: 1px solid #404040;
        }

        .artifact-title {
            font-size: 13px;
            font-weight: 500;
            color: #b3b3b3;
        }

        .artifact-actions {
            display: flex;
            gap: 8px;
        }

        .artifact-btn {
            background: none;
            border: 1px solid #555;
            color: #b3b3b3;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .artifact-btn:hover {
            background-color: #404040;
            color: #fff;
        }
        
        .artifact-btn.view-btn {
            border-color: #4a90e2;
            color: #4a90e2;
        }
        .artifact-btn.view-btn:hover {
            background-color: #4a90e2;
            color: #fff;
        }

        .artifact-btn svg {
            width: 14px;
            height: 14px;
        }

        .artifact-code {
            padding: 12px;
            max-height: 400px;
            overflow: auto;
            scrollbar-width: thin;
            scrollbar-color: #404040 #1a1a1a;
        }
        
        .artifact-code pre {
            margin: 0;
        }

        .artifact-code code {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            color: #e5e5e5;
            white-space: pre;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 240px;
            }
            
            .greeting {
                font-size: 24px;
            }
            
            .action-buttons {
                flex-direction: column;
                width: 100%;
            }
            
            .action-btn {
                justify-content: center;
            }
        }
    
        /* Enhanced message formatting */
        .message-content { min-width: 0; }
        .message-text-part { line-height: 1.65; overflow-wrap: anywhere; }
        .message-text-part h1,.message-text-part h2,.message-text-part h3,.message-text-part h4,.message-text-part h5,.message-text-part h6 { margin: 16px 0 8px; color:#fff; line-height:1.3; }
        .message-text-part h1 { font-size:1.45em; } .message-text-part h2 { font-size:1.3em; } .message-text-part h3 { font-size:1.15em; }
        .message-text-part p { margin: 0 0 10px; } .message-text-part p:last-child { margin-bottom:0; }
        .message-text-part ul,.message-text-part ol { margin: 8px 0 12px 24px; padding-left: 18px; }
        .message-text-part li { margin: 4px 0; padding-left: 3px; }
        .message-text-part blockquote { margin:10px 0; padding:8px 12px; border-left:3px solid #777; color:#bbb; background:#252525; border-radius:4px; }
        .message-text-part hr { border:0; border-top:1px solid #444; margin:16px 0; }
        .message-text-part code.inline-code { background:#303030; border:1px solid #444; padding:2px 5px; border-radius:4px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.9em; }
        .message-text-part a { color:#ff9a70; text-decoration:underline; }
        .markdown-table { width:100%; border-collapse:collapse; margin:12px 0; font-size:14px; }
        .markdown-table th,.markdown-table td { border:1px solid #454545; padding:7px 9px; text-align:left; }
        .markdown-table th { background:#303030; color:#fff; }
        .assistant-actions { margin-top:8px; display:flex; gap:6px; }
        .copy-response-btn { background:transparent; color:#999; border:1px solid #444; border-radius:6px; padding:5px 9px; cursor:pointer; font-size:12px; }
        .copy-response-btn:hover { color:#fff; background:#303030; }
        .recent-item-row { display:flex; align-items:center; gap:6px; }
        .recent-item-row .recent-item { flex:1; min-width:0; }
        .delete-chat-btn { flex:0 0 auto; background:none; border:0; color:#777; cursor:pointer; padding:5px; border-radius:5px; }
        .delete-chat-btn:hover { color:#ff6b6b; background:#333; }
        .attachment-bar { display:flex; flex-wrap:wrap; gap:7px; padding:0 0 8px; }
        .attachment-chip { display:flex; align-items:center; gap:6px; background:#303030; border:1px solid #484848; border-radius:7px; padding:5px 8px; font-size:12px; max-width:220px; }
        .attachment-chip span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .remove-attachment { background:none; border:0; color:#aaa; cursor:pointer; font-size:15px; }
        .attach-btn { background:none; border:0; color:#aaa; cursor:pointer; padding:7px; border-radius:6px; }
        .attach-btn:hover { color:#fff; background:#303030; }
        .search-container.with-attachments { flex-direction:column; align-items:stretch; }
        .composer-row { display:flex; align-items:flex-end; gap:8px; }
        .composer-row .search-input { flex:1; }
        @media (max-width:700px) { .message-content { max-width:90% !important; } .markdown-table { font-size:12px; } }

    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg class="back-arrow" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                    </svg>
                    Claude
                </div>
                <button class="new-chat-btn" id="newChatBtn">
                    <div class="plus-icon">+</div>
                    New chat
                </button>
            </div>
            
            <div class="sidebar-nav">
                <div class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1z"/>
                    </svg>
                    Chats
                </div>
                <div class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.11 0 2-.9 2-2V5c0-1.1-.89-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                    </svg>
                    Projects
                </div>
                <div class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                    </svg>
                    Artifacts
                </div>
            </div>
            
            <div class="sidebar-content">
                <div class="section-title">Recents</div>
                <div class="recent-items" id="recentItems">
                    <div class="empty-state" id="emptyState">
                        <span style="color: #666; font-size: 13px; font-style: italic;">No recent conversations</span>
                    </div>
                </div>
            </div>
            
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">U</div>
                    <div class="user-details">
                        <div class="user-name">User</div>
                        <div class="user-plan">Puter account</div>
                    </div>
                    <svg class="chevron-down" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
                    </svg>
                </div>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <div class="content-area">
                <!-- Welcome Screen -->
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="greeting">
                        <svg class="sun-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
                        </svg>
                        Good morning, User
                    </div>
                    
                    <div class="search-container">
                        <textarea class="search-input" id="welcomeInput" placeholder="How can I help you today?" rows="1"></textarea>
                        <div class="search-actions">
                            <button class="search-btn" id="researchBtn">Research</button>
                            <button class="send-btn" id="sendBtn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div style="max-width: 600px; margin-bottom: 15px; padding: 12px; background-color: #2a2a2a; border-radius: 8px; border: 1px solid #404040;">
                        <div style="font-size: 13px; color: #b3b3b3; text-align: center; margin-bottom: 10px;">
                            💡 <strong>First time?</strong> A small popup will appear for authentication - please allow it to enable free Claude access via Puter.js
                        </div>
                        <div style="font-size: 12px; color: #808080; text-align: center; margin-bottom: 10px;" id="protocolNotice">
                            <!-- This will be populated by JS -->
                        </div>
                        <div style="text-align: center;">
                            <button id="authButton" style="background-color: #ff6b35; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 12px;">
                                🔐 Authenticate with Puter
                            </button>
                        </div>
                    </div>
                    
                    <div class="model-selector">
                        <button class="model-btn" id="modelSelector">
                            <span id="currentModel">Claude Sonnet 4</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
                            </svg>
                        </button>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="action-btn" data-prompt="Help me write">
                            <svg class="action-icon" viewBox="0 0 24 24" fill="currentColor">

                            Learn
                        </button>
                        <button class="action-btn" data-prompt="Help me code">

                        </button>
                        <button class="action-btn" data-prompt="Help me with daily tasks">
                            <svg class="action-icon" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>

                            Life stuff

                            <svg class="action-icon" viewBox="0 0 24 24" fill="currentColor">

                <!-- Chat Container -->
                <div class="chat-container" id="chatContainer">
                    <div class="chat-messages" id="chatMessages"></div>
                    
                    <div class="typing-indicator" id="typingIndicator">
                        <div class="message-avatar">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                            </svg>
                        </div>
                        <span>AI is typing</span>
                        <div class="typing-dots">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>

                    <div class="search-container" id="chatComposer">
                        <div class="attachment-bar" id="attachmentBar" style="display:none"></div>
                        <div class="composer-row">
                            <input type="file" id="attachmentInput" multiple hidden>
                            <button class="attach-btn" id="attachBtn" title="Attach files" aria-label="Attach files">📎</button>
                            <textarea class="search-input" id="chatInput" placeholder="Message AI..." rows="1"></textarea>
                            <div class="search-actions">
                                <button class="model-btn" id="chatModelSelector" style="padding: 6px 8px; font-size: 12px;">
                                    <span id="chatCurrentModel">Sonnet 4</span>
                                </button>
                                <button class="send-btn" id="chatSendBtn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>

    </div>

    <script>
        // Global state
        const availableModels = [
            { apiName: 'claude-sonnet-4', displayName: 'Claude Sonnet 4', shortName: 'Sonnet 4' },
            { apiName: 'claude-opus-4', displayName: 'Claude Opus 4', shortName: 'Opus 4' },
            { apiName: 'claude-3-7-sonnet', displayName: 'Claude 3.7 Sonnet', shortName: 'Sonnet 3.7' }
        ];
        let currentModel = availableModels[0].apiName;
        let chatHistory = [];
        let isStreaming = false;
        let recentConversations = [];
        let currentConversationId = null;
        let pendingAttachments = [];
        const APP_NAME = 'AI Assistant';
        const USER_NAME = 'User';

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Initializing Claude interface...');
            initializeInterface();
            loadRecentConversations();
            updateRecentItems();
            updateModelDisplay();
            updateProtocolNotice();
        });

        function updateProtocolNotice() {
            const protocolNotice = document.getElementById('protocolNotice');
            if (protocolNotice) {
                if (window.location.protocol === 'file:') {
                    protocolNotice.innerHTML = '✅ <strong>File mode:</strong> Authentication should work perfectly here!';
                    protocolNotice.style.color = '#22c55e';
                } else if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    protocolNotice.innerHTML = '⚠️ <strong>Server mode:</strong> If auth fails, browser profile issues are likely. See guide below.';
                    protocolNotice.style.color = '#f59e0b';
                } else {
                    protocolNotice.innerHTML = '🌐 <strong>Web mode:</strong> Make sure popups are allowed for this domain.';
                    protocolNotice.style.color = '#3b82f6';
                }
            }
        }

        async function handleManualAuth() {
            const authButton = document.getElementById('authButton');
            
            try {
                if (authButton) {
                    authButton.textContent = '🔄 Authenticating...';
                    authButton.disabled = true;
                }
                
                console.log('🔐 Manually triggering Puter authentication...');
                
                // Trigger authentication with a simple test call
                const authResponse = await puter.ai.chat("test", {model: 'claude-sonnet-4'});
                
                console.log('✅ Raw auth response:', authResponse);

                // Check for a successful response structure
                if (authResponse && (authResponse.message?.content || authResponse.success !== false)) {
                     console.log('✅ Authentication successful!');
                    if (authButton) {
                        authButton.textContent = '✅ Authenticated';
                        authButton.style.backgroundColor = '#22c55e';
                        setTimeout(() => {
                           const authBox = authButton.closest('div[style*="max-width: 600px"]');
                           if(authBox) authBox.style.display = 'none';
                        }, 2000);
                    }
                } else {
                    throw new Error('Authentication response indicates failure.');
                }
                
            } catch (error) {
                console.error('❌ Manual authentication failed:', error);
                
                if (authButton) {
                    authButton.textContent = '❌ Auth Failed - Try Guide';
                    authButton.disabled = false;
                    authButton.style.backgroundColor = '#dc2626';
                }
                
                // --- ENHANCED ERROR MESSAGE ---
                const troubleshootGuide = `
⚠️ AUTHENTICATION FAILED!

This usually happens because of your browser profile settings (extensions, cache, etc.), NOT a bug in the code.

As you noticed, it works in a new Guest or Incognito profile. Here is how to fix it in your MAIN profile:

--- TROUBLESHOOTING GUIDE ---

✅ QUICKEST FIX (TRY FIRST):
1.  🥷 Use Incognito/Private Mode:
    • Press Ctrl+Shift+N (Chrome/Edge) or Ctrl+Shift+P (Firefox).
    • Open this HTML file there. This is the fastest workaround.

🔧 TO FIX YOUR MAIN PROFILE (TRY IN ORDER):
2.  🔌 Disable Extensions:
    • Go to your browser's extensions page (e.g., chrome://extensions).
    • TEMPORARILY disable ALL extensions, especially ad-blockers (uBlock, AdBlock) and privacy blockers.
    • Refresh this page and try authenticating again.

3.  🧹 Clear Site Data for Puter:
    • Go to puter.com, click the 🔒 icon in the address bar -> Site Settings/Cookies and site data -> Delete data.
    • Refresh this page and try again.

4.  🍪 Allow Third-Party Cookies:
    • Go to your browser's cookie settings (e.g., chrome://settings/cookies).
    • Ensure "Block third-party cookies" is NOT enabled, or add "[*.]puter.com" to the allowed list.

If you are running this from a local server (like localhost), the issue is almost certainly extensions or cookie settings.
`;
                alert(troubleshootGuide);
            }
        }

        function initializeInterface() {
            document.title = APP_NAME;
            document.querySelectorAll('.logo').forEach(el => { const t=el.querySelector('.logo-text'); if(t) t.textContent=APP_NAME; });
            const userNameEl=document.querySelector('.user-name'); if(userNameEl) userNameEl.textContent=USER_NAME;
            const avatarEl=document.querySelector('.user-avatar'); if(avatarEl) avatarEl.textContent=USER_NAME.charAt(0).toUpperCase();
            const greeting=document.querySelector('.greeting'); if(greeting){ const svg=greeting.querySelector('svg'); greeting.innerHTML=''; if(svg) greeting.appendChild(svg); greeting.append('Good morning, '+USER_NAME); }
            const welcomeInput = document.getElementById('welcomeInput');
            const chatInput = document.getElementById('chatInput');
            const sendBtn = document.getElementById('sendBtn');
            const chatSendBtn = document.getElementById('chatSendBtn');
            const newChatBtn = document.getElementById('newChatBtn');
            const actionBtns = document.querySelectorAll('.action-btn');
            const modelSelectors = document.querySelectorAll('#modelSelector, #chatModelSelector');
            const authButton = document.getElementById('authButton');
            const attachBtn = document.getElementById('attachBtn');
            const attachmentInput = document.getElementById('attachmentInput');

            if (attachBtn && attachmentInput) {
                attachBtn.addEventListener('click', () => attachmentInput.click());
                attachmentInput.addEventListener('change', handleAttachmentSelection);
            }

            if (authButton) authButton.addEventListener('click', handleManualAuth);

            [welcomeInput, chatInput].forEach(textarea => {
                if (textarea) {
                    textarea.addEventListener('input', () => autoResize(textarea));
                    textarea.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            if (textarea === welcomeInput) handleWelcomeMessage();
                            else handleChatMessage();
                        }
                    });
                }
            });

            if (sendBtn) sendBtn.addEventListener('click', handleWelcomeMessage);
            if (chatSendBtn) chatSendBtn.addEventListener('click', handleChatMessage);
            if (newChatBtn) newChatBtn.addEventListener('click', startNewChat);

            actionBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const prompt = this.getAttribute('data-prompt');
                    if (prompt && welcomeInput) {
                        welcomeInput.value = prompt;
                        welcomeInput.focus();
                        autoResize(welcomeInput);
                    }
                });
            });

            modelSelectors.forEach(selector => {
                if (selector) selector.addEventListener('click', toggleModel);
            });

            if (welcomeInput) welcomeInput.focus();
            console.log('✅ Interface initialized');
        }

        function updateModelDisplay() {
            const model = availableModels.find(m => m.apiName === currentModel);
            if (!model) {
                console.error("Model not found in available models:", currentModel);
                return;
            }
            document.getElementById('currentModel').textContent = model.displayName;
            document.getElementById('chatCurrentModel').textContent = model.shortName;
        }

        function toggleModel() {
            const currentIndex = availableModels.findIndex(m => m.apiName === currentModel);
            const nextIndex = (currentIndex + 1) % availableModels.length;
            currentModel = availableModels[nextIndex].apiName;
            updateModelDisplay();
            console.log('🔄 Model switched to:', availableModels[nextIndex].displayName);
        }

        async function handleWelcomeMessage() {
            const welcomeInput = document.getElementById('welcomeInput');
            const message = welcomeInput.value.trim();
            if (!message || isStreaming) return;
            console.log('📤 Sending welcome message:', message);
            createNewConversation(message);
            switchToChatView();
            await sendMessage(message);
        }

        async function handleChatMessage() {
            const chatInput = document.getElementById('chatInput');
            const message = chatInput.value.trim();
            if ((!message && pendingAttachments.length === 0) || isStreaming) return;
            const attachments = [...pendingAttachments];
            chatInput.value = '';
            pendingAttachments = [];
            renderAttachmentBar();
            autoResize(chatInput);
            await sendMessage(message, attachments);
        }

        function handleAttachmentSelection(e) {
            const files = Array.from(e.target.files || []);
            const maxSize = 25 * 1024 * 1024;
            const accepted = files.filter(file => {
                if (file.size > maxSize) { alert(`${file.name} is larger than 25 MB.`); return false; }
                return true;
            });
            pendingAttachments.push(...accepted);
            renderAttachmentBar();
            e.target.value = '';
        }

        function renderAttachmentBar() {
            const bar = document.getElementById('attachmentBar');
            const composer = document.getElementById('chatComposer');
            if (!bar) return;
            bar.innerHTML = '';
            bar.style.display = pendingAttachments.length ? 'flex' : 'none';
            if (composer) composer.classList.toggle('with-attachments', pendingAttachments.length > 0);
            pendingAttachments.forEach((file, index) => {
                const chip = document.createElement('div');
                chip.className = 'attachment-chip';
                const name = document.createElement('span');
                name.textContent = `${file.name} (${formatFileSize(file.size)})`;
                const remove = document.createElement('button');
                remove.className = 'remove-attachment';
                remove.type = 'button';
                remove.textContent = '×';
                remove.title = 'Remove attachment';
                remove.onclick = () => { pendingAttachments.splice(index, 1); renderAttachmentBar(); };
                chip.appendChild(name); chip.appendChild(remove); bar.appendChild(chip);
            });
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return `${bytes} B`;
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
            return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
        }

        function createNewConversation(firstMessage) {
            currentConversationId = 'conv_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            const title = firstMessage.length > 50 ? firstMessage.substring(0, 50) + '...' : firstMessage;
            const conversation = {
                id: currentConversationId,
                title: title,
                messages: [],
                timestamp: new Date(),
                model: currentModel
            };
            recentConversations.unshift(conversation);
            saveRecentConversations();
            if (recentConversations.length > 10) {
                recentConversations = recentConversations.slice(0, 10);
            }
            saveRecentConversations();
            updateRecentItems();
            console.log('📝 Created new conversation:', title);
        }

        function updateRecentItems() {
            const recentItemsContainer = document.getElementById('recentItems');
            recentItemsContainer.innerHTML = '';
            if (recentConversations.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-state';
                emptyDiv.innerHTML = '<span style="color: #666; font-size: 13px; font-style: italic;">No recent conversations</span>';
                recentItemsContainer.appendChild(emptyDiv);
            } else {
                recentConversations.forEach(conversation => {
                    const row = document.createElement('div'); row.className='recent-item-row';
                    const itemDiv = document.createElement('div'); itemDiv.className='recent-item'; itemDiv.textContent=conversation.title;
                    itemDiv.addEventListener('click', () => loadConversation(conversation.id));
                    const del = document.createElement('button'); del.className='delete-chat-btn'; del.type='button'; del.title='Delete chat'; del.innerHTML='🗑';
                    del.addEventListener('click', e => { e.stopPropagation(); deleteConversation(conversation.id); });
                    row.appendChild(itemDiv); row.appendChild(del); recentItemsContainer.appendChild(row);
                });
            }
        }

        function deleteConversation(conversationId) {
            const conversation = recentConversations.find(c => c.id === conversationId);
            if (!conversation) return;
            if (!confirm(`Delete “${conversation.title}”?`)) return;
            recentConversations = recentConversations.filter(c => c.id !== conversationId);
            saveRecentConversations();
            updateRecentItems();
            if (currentConversationId === conversationId) startNewChat();
        }

        function saveRecentConversations() {
            try { localStorage.setItem('ai_recent_conversations', JSON.stringify(recentConversations)); } catch(e) { console.warn('Could not save conversations',e); }
        }

        function loadRecentConversations() {
            try { const saved=JSON.parse(localStorage.getItem('ai_recent_conversations')||'[]'); if(Array.isArray(saved)) recentConversations=saved; } catch(e) { recentConversations=[]; }
        }

        function loadConversation(conversationId) {
            const conversation = recentConversations.find(conv => conv.id === conversationId);
            if (!conversation) return;
            currentConversationId = conversationId;
            chatHistory = [...conversation.messages];
            currentModel = conversation.model;
            updateModelDisplay();
            switchToChatView();
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = '';
            conversation.messages.forEach(msg => {
                addMessage(msg.content, msg.role);
            });
            document.getElementById('chatInput').focus();
            console.log('📂 Loaded conversation:', conversation.title);
        }

        function switchToChatView() {
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('chatContainer').classList.add('active');
            console.log('🔄 Switched to chat view');
        }

        function startNewChat() {
            chatHistory = [];
            currentConversationId = null;
            
            // --- BUG FIX: Reset model to default on new chat ---
            currentModel = availableModels[0].apiName;
            updateModelDisplay();
            
            const welcomeScreen = document.getElementById('welcomeScreen');
            const chatContainer = document.getElementById('chatContainer');
            const chatMessages = document.getElementById('chatMessages');
            const welcomeInput = document.getElementById('welcomeInput');
            
            if (welcomeScreen) welcomeScreen.style.display = 'flex';
            if (chatContainer) chatContainer.classList.remove('active');
            if (chatMessages) chatMessages.innerHTML = '';
            if (welcomeInput) {
                welcomeInput.value = '';
                autoResize(welcomeInput);
                welcomeInput.focus();
            }
            autoResize(document.getElementById('chatInput'));
            
            console.log('🆕 Started new chat, model reset to default.');
        }

        async function sendMessage(message, attachments = []) {
            if (isStreaming) return;
            
            console.log('🚀 Starting to send message...');
            addMessage(message, 'user', false, attachments);
            showTypingIndicator();
            setInputState(false);

            let userContent = message;
            if (attachments.length) {
                const fileMessages = [];
                for (const file of attachments) {
                    if (typeof puter === 'undefined' || !puter.fs || !puter.fs.upload) throw new Error('File uploads are not available in this Puter.js version.');
                    const uploaded = await puter.fs.upload(file);
                    const puterPath = uploaded?.path || uploaded?.name || uploaded;
                    if (!puterPath) throw new Error(`Could not upload ${file.name}.`);
                    fileMessages.push({ type: 'file', puter_path: puterPath });
                }
                userContent = [{ type: 'text', text: message || 'Please analyze the attached file(s).' }, ...fileMessages];
            }
            chatHistory.push({ role: 'user', content: userContent });
            
            try {
                isStreaming = true;
                if (typeof puter === 'undefined') { throw new Error('Puter.js is not available.'); }
                console.log('📡 Calling Puter AI with model:', currentModel, 'and full history.');
                
                const response = await puter.ai.chat(chatHistory, {
                    model: currentModel,
                    stream: true
                });

                if (response && response.success === false) {
                    throw new Error('Authentication required. Please click the authenticate button and allow the popup.');
                }
                
                const { messageContent } = addMessage('', 'assistant');
                hideTypingIndicator();
                let fullResponse = '';
                
                for await (const part of response) {
                    if (part?.text) {
                        fullResponse += part.text;
                        renderFormattedMessage(fullResponse, messageContent);
                        scrollToBottom();
                    }
                }
                
                console.log('✅ Streaming complete.');
                renderFormattedMessage(fullResponse, messageContent); 
                
                chatHistory.push({ role: 'assistant', content: fullResponse });
                updateCurrentConversation();
                
            } catch (error) {
                console.error('❌ Error in sendMessage:', error);
                hideTypingIndicator();
                addMessage('Sorry, I encountered an error: ' + (error.message || 'Unknown error.'), 'assistant', true);
                
                // FIX: The API call failed, so the optimistic user message added to the history
                // resulted in an invalid state. Remove it to allow the user to try again.
                if (chatHistory.length > 0 && chatHistory[chatHistory.length - 1].role === 'user') {
                    chatHistory.pop();
                }

            } finally {
                isStreaming = false;
                setInputState(true);
                document.getElementById('chatInput')?.focus();
            }
        }

        function updateCurrentConversation() {
            if (!currentConversationId) return;
            const conversation = recentConversations.find(conv => conv.id === currentConversationId);
            if (conversation) {
                conversation.messages = [...chatHistory];
                conversation.timestamp = new Date();
                const index = recentConversations.indexOf(conversation);
                if (index > 0) {
                    recentConversations.splice(index, 1);
                    recentConversations.unshift(conversation);
                    updateRecentItems();
                }
                saveRecentConversations();
            }
        }

        function addMessage(content, role, isError = false, attachments = []) {
            const chatMessages = document.getElementById('chatMessages');
            const messageId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.setAttribute('data-message-id', messageId);

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = role === 'user' ? 'U' : 'AI';

            const column = document.createElement('div');
            column.className = 'message-column';
            column.style.minWidth = '0';
            column.style.maxWidth = '75%';
            column.style.width = 'fit-content';

            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.dataset.rawContent = typeof content === 'string' ? content : '';

            if (role === 'assistant') {
                renderFormattedMessage(typeof content === 'string' ? content : '', messageContent);
            } else {
                if (Array.isArray(content)) {
                    const text = content.find(x => x?.type === 'text')?.text || '';
                    messageContent.textContent = text;
                } else messageContent.textContent = content || '';
                attachments.forEach(file => {
                    const chip = document.createElement('div');
                    chip.className = 'attachment-chip';
                    const span = document.createElement('span'); span.textContent = `📎 ${file.name}`;
                    chip.appendChild(span); messageContent.appendChild(chip);
                });
            }
            if (isError) messageContent.style.color = '#ff6b6b';
            column.appendChild(messageContent);

            if (role === 'assistant' && !isError) {
                const actions = document.createElement('div');
                actions.className = 'assistant-actions';
                const copy = document.createElement('button');
                copy.className = 'copy-response-btn';
                copy.type = 'button';
                copy.textContent = 'Copy';
                copy.onclick = async () => {
                    const raw = messageContent.dataset.rawContent || '';
                    try { await navigator.clipboard.writeText(raw); }
                    catch { const ta=document.createElement('textarea'); ta.value=raw; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
                    copy.textContent = 'Copied!'; setTimeout(() => copy.textContent = 'Copy', 1500);
                };
                actions.appendChild(copy); column.appendChild(actions);
            }
            messageDiv.appendChild(avatar); messageDiv.appendChild(column); chatMessages.appendChild(messageDiv);
            scrollToBottom();
            return { messageId, messageContent };
        }

        function escapeHtml(value) {
            return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        function inlineMarkdown(text) {
            let x = escapeHtml(text);
            x = x.replace(/`([^`\n]+)`/g, '<code class="inline-code">$1</code>');
            x = x.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
            x = x.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
            x = x.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
            x = x.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
            x = x.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
            x = x.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
            x = x.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>');
            return x;
        }

        function renderInlineLine(line) { return inlineMarkdown(line); }

        function isTableSeparator(line) { return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line); }

        function renderMarkdownText(text) {
            const lines = String(text).replace(/\r\n?/g,'\n').split('\n');
            let html='', i=0, paragraph=[];
            const flushParagraph=()=>{ if(!paragraph.length)return; html += '<p>'+paragraph.map(renderInlineLine).join('<br>')+'</p>'; paragraph=[]; };
            while(i<lines.length){
                const line=lines[i];
                if(/^\s*$/.test(line)){ flushParagraph(); i++; continue; }
                const fence=line.match(/^\s*```\s*([\w+-]*)\s*$/);
                if(fence){ flushParagraph(); let code=[], j=i+1; while(j<lines.length && !/^\s*```\s*$/.test(lines[j])){code.push(lines[j]);j++;} html += '<pre><code>'+escapeHtml(code.join('\n'))+'</code></pre>'; i=j<lines.length?j+1:j; continue; }
                const heading=line.match(/^\s*(#{1,6})\s+(.+?)\s*#*\s*$/);
                if(heading){ flushParagraph(); const n=heading[1].length; html += `<h${n}>${renderInlineLine(heading[2])}</h${n}>`; i++; continue; }
                if(/^\s*[-*_]\s*[-*_]\s*[-*_]\s*[-*_]*\s*$/.test(line)){ flushParagraph(); html+='<hr>'; i++; continue; }
                if(/^\s*>/.test(line)){ flushParagraph(); const q=[]; while(i<lines.length && /^\s*>/.test(lines[i])){q.push(lines[i].replace(/^\s*>\s?/,''));i++;} html+='<blockquote>'+q.map(renderInlineLine).join('<br>')+'</blockquote>'; continue; }
                // Tables
                if(i+1<lines.length && line.includes('|') && isTableSeparator(lines[i+1])){
                    flushParagraph();
                    const cells=r=>r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
                    const heads=cells(line); i+=2; const rows=[]; while(i<lines.length && lines[i].includes('|') && !/^\s*$/.test(lines[i])){rows.push(cells(lines[i]));i++;}
                    html+='<table class="markdown-table"><thead><tr>'+heads.map(c=>'<th>'+renderInlineLine(c)+'</th>').join('')+'</tr></thead><tbody>';
                    rows.forEach(r=>{html+='<tr>'+heads.map((_,k)=>'<td>'+renderInlineLine(r[k]||'')+'</td>').join('')+'</tr>';}); html+='</tbody></table>'; continue;
                }
                const ol=line.match(/^\s*(\d+)[.)]\s+(.+)$/);
                if(ol){ flushParagraph(); const items=[]; while(i<lines.length){const m=lines[i].match(/^\s*\d+[.)]\s+(.+)$/); if(!m)break; items.push(m[1]); i++;} html+='<ol>'+items.map(v=>'<li>'+renderInlineLine(v)+'</li>').join('')+'</ol>'; continue; }
                const ul=line.match(/^\s*[-+*]\s+(.+)$/);
                if(ul){ flushParagraph(); const items=[]; while(i<lines.length){const m=lines[i].match(/^\s*[-+*]\s+(.+)$/); if(!m)break; items.push(m[1]); i++;} html+='<ul>'+items.map(v=>'<li>'+renderInlineLine(v)+'</li>').join('')+'</ul>'; continue; }
                paragraph.push(line); i++;
            }
            flushParagraph(); return html;
        }

        function renderFormattedMessage(content, container) {
            container.innerHTML='';
            container.dataset.rawContent=content || '';
            const codeBlockRegex=/```([\w+-]*)\n([\s\S]*?)```/g;
            let last=0, match;
            while((match=codeBlockRegex.exec(content||''))!==null){
                if(match.index>last){ const part=document.createElement('div'); part.className='message-text-part'; part.innerHTML=renderMarkdownText(content.substring(last,match.index)); container.appendChild(part); }
                container.appendChild(createArtifactCanvas(match[2].trim(),match[1]||'text')); last=match.index+match[0].length;
            }
            if(last<(content||'').length){ const part=document.createElement('div'); part.className='message-text-part'; part.innerHTML=renderMarkdownText(content.substring(last)); container.appendChild(part); }
            if(!container.children.length && content){ const part=document.createElement('div'); part.className='message-text-part'; part.innerHTML=renderMarkdownText(content); container.appendChild(part); }
        }

        function createArtifactCanvas(code, language) {
            const canvas = document.createElement('div');
            canvas.className = 'artifact-canvas';

            const header = document.createElement('div');
            header.className = 'artifact-header';
            
            const title = document.createElement('div');
            title.className = 'artifact-title';
            title.textContent = language ? `${language} code` : 'Code Artifact';
            
            const actions = document.createElement('div');
            actions.className = 'artifact-actions';

            if (language.toLowerCase() === 'html') {
                const viewBtn = document.createElement('button');
                viewBtn.className = 'artifact-btn view-btn';
                viewBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5C21.27 7.61 17 4.5 12 4.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg> View`;
                viewBtn.onclick = () => {
                    const blob = new Blob([code], { type: 'text/html' });
                    window.open(URL.createObjectURL(blob), '_blank');
                };
                actions.appendChild(viewBtn);
            }
            
            const copyBtn = document.createElement('button');
            copyBtn.className = 'artifact-btn';
            const copyIcon = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy`;
            copyBtn.innerHTML = copyIcon;
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(code).then(() => {
                    copyBtn.textContent = 'Copied!';
                    setTimeout(() => { copyBtn.innerHTML = copyIcon; }, 2000);
                });
            };

            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'artifact-btn';
            downloadBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> Download`;
            downloadBtn.onclick = () => {
                const extensionMap = { javascript: 'js', python: 'py', html: 'html', css: 'css', json: 'json', java: 'java', csharp: 'cs', cpp: 'cpp', ruby: 'rb', go: 'go', rust: 'rs', shell: 'sh', bash: 'sh' };
                const extension = extensionMap[language.toLowerCase()] || 'txt';
                const filename = `claude-code.${extension}`;
                const blob = new Blob([code], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                a.click();
                a.remove();
            };

            actions.appendChild(copyBtn);
            actions.appendChild(downloadBtn);
            header.appendChild(title);
            header.appendChild(actions);

            const codeArea = document.createElement('div');
            codeArea.className = 'artifact-code';
            const pre = document.createElement('pre');
            const codeEl = document.createElement('code');
            codeEl.textContent = code;
            pre.appendChild(codeEl);
            codeArea.appendChild(pre);

            canvas.appendChild(header);
            canvas.appendChild(codeArea);

            return canvas;
        }

        function showTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.style.display = 'flex';
                scrollToBottom();
            }
        }

        function hideTypingIndicator() {
            document.getElementById('typingIndicator').style.display = 'none';
        }

        function setInputState(enabled) {
            const inputs = [
                document.getElementById('welcomeInput'),
                document.getElementById('chatInput'),
                document.getElementById('sendBtn'),
                document.getElementById('chatSendBtn')
            ];
            inputs.forEach(input => {
                if (input) {
                    input.disabled = !enabled;
                    input.style.opacity = enabled ? '1' : '0.6';
                }
            });
        }

        function scrollToBottom() {
            const chatMessages = document.getElementById('chatMessages');
            if (chatMessages) {
                requestAnimationFrame(() => {
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                });
            }
        }

        function autoResize(textarea) {
            if (!textarea) return;
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
        }
    </script>
</body>
