<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background-color: #1a1a1a;
            color: #e5e5e5;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background-color: #262626;
            border-right: 1px solid #404040;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid #404040;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 16px;
        }

        .back-arrow {
            width: 20px;
            height: 20px;
            opacity: 0.7;
        }

        .new-chat-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            color: #ff6b35;
            font-size: 14px;
            padding: 8px 0;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .new-chat-btn:hover {
            opacity: 0.8;
        }

        .plus-icon {
            width: 16px;
            height: 16px;
            background-color: #ff6b35;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
        }

        .sidebar-nav {
            padding: 16px;
            border-bottom: 1px solid #404040;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            color: #b3b3b3;
            font-size: 14px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item:hover {
            color: #fff;
        }

        .nav-icon {
            width: 16px;
            height: 16px;
            opacity: 0.7;
        }

        .sidebar-content {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 12px;
            color: #808080;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .recent-items {
            min-height: 20px;
        }

        .recent-item {
            padding: 8px 0;
            color: #b3b3b3;
            font-size: 13px;
            cursor: pointer;
            transition: color 0.2s;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .recent-item:hover {
            color: #fff;
        }

        .empty-state {
            padding: 8px 0;
            text-align: center;
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid #404040;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            background-color: #ff6b35;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: white;
        }

        .user-details {
            flex: 1;
        }

        .user-name {
            font-size: 14px;
            color: #fff;
            font-weight: 500;
        }

        .user-plan {
            font-size: 12px;
            color: #808080;
        }

        .chevron-down {
            width: 16px;
            height: 16px;
            opacity: 0.5;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #1a1a1a;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            position: relative;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 40px;
        }

        .chat-container {
            display: none;
            flex-direction: column;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
        }

        .chat-container.active {
            display: flex;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px;
            margin-bottom: 20px;
            height: calc(100vh - 200px);
            min-height: 0;
            scrollbar-width: thin;
            scrollbar-color: #404040 #262626;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #262626;
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #404040;
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .message {
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background-color: #ff6b35;
            color: white;
        }

        .message.assistant .message-avatar {
            background-color: #4a90e2;
            color: white;
        }

        .message-content {
            max-width: 70%;
            background-color: #262626;
            border-radius: 12px;
            padding: 16px;
            color: #e5e5e5;
            line-height: 1.5;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
        }
        .message.assistant .message-content {
            padding: 0; /* Remove padding for container of artifacts */
        }
        .message-text-part {
            padding: 16px;
            white-space: pre-wrap;
        }

        .message.user .message-content {
            background-color: #ff6b35;
            color: white;
            padding: 16px; /* Restore padding for user messages */
        }


        .attachment-input { display: none; }
        .attachment-bar {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 12px 8px;
        }
        .attachment-bar.has-files { display: flex; }
        .attachment-chip {
            display: inline-flex; align-items: center; gap: 7px;
            max-width: 260px; padding: 7px 9px; border: 1px solid #404040;
            border-radius: 8px; background: #252525; color: #ddd; font-size: 12px;
        }
        .attachment-chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .attachment-chip-remove {
            border: 0; background: transparent; color: #999; cursor: pointer;
            font-size: 16px; line-height: 1; padding: 0 2px;
        }
        .attachment-chip-remove:hover { color: #fff; }
        .message-attachments { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:8px; }
        .message-attachment {
            display:inline-flex; align-items:center; gap:6px; padding:6px 9px;
            border:1px solid #3d3d3d; border-radius:7px; color:#bbb; font-size:12px;
            background:#202020;
        }
        .recent-item { position: relative; padding-right: 36px !important; }
        .delete-chat-btn {
            position:absolute; right:8px; top:50%; transform:translateY(-50%);
            width:26px; height:26px; border:0; border-radius:6px; background:transparent;
            color:#888; cursor:pointer; opacity:0; transition:opacity .15s, background .15s, color .15s;
        }
        .recent-item:hover .delete-chat-btn, .delete-chat-btn:focus { opacity:1; }
        .delete-chat-btn:hover { background:#3a3a3a; color:#ff6b6b; }
        .chat-attachment-btn {
            width:34px; height:34px; border:1px solid #3d3d3d; border-radius:8px;
            background:#252525; color:#aaa; cursor:pointer; display:flex; align-items:center; justify-content:center;
        }
        .chat-attachment-btn:hover { color:#fff; background:#303030; }

        .assistant-actions {
            display: flex;
            justify-content: flex-start;
            margin-top: 8px;
            padding-left: 2px;
        }

        .copy-response-btn {
            border: 1px solid #3a3a3a;
            background: transparent;
            color: #9a9a9a;
            border-radius: 7px;
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background .15s ease, color .15s ease, border-color .15s ease;
        }

        .copy-response-btn:hover {
            background: #2a2a2a;
            color: #e5e5e5;
            border-color: #505050;
        }

        .message-text-part {
            padding: 16px;
            white-space: normal;
        }

        .message-text-part ul, .message-text-part ol { margin: 8px 0 8px 24px; padding-left: 20px; }
        .message-text-part ul { list-style-type: disc; }
        .message-text-part ol { list-style-type: decimal; }
        .message-text-part li { margin: 4px 0; padding-left: 3px; }
        .message-text-part h1, .message-text-part h2, .message-text-part h3, .message-text-part h4, .message-text-part h5, .message-text-part h6 { margin: 18px 0 10px; line-height: 1.25; color: #f2f2f2; }
        .message-text-part h1 { font-size: 1.55em; }
        .message-text-part h2 { font-size: 1.35em; }
        .message-text-part h3 { font-size: 1.18em; }
        .message-text-part strong { font-weight: 700; }
        .message-text-part em { font-style: italic; }
        .message-text-part del { opacity: .75; }
        .message-text-part .inline-code { font-family: "SF Mono", "Fira Code", Consolas, monospace; font-size: .9em; background: #1b1b1b; border: 1px solid #3d3d3d; border-radius: 5px; padding: 2px 5px; }
        .message-text-part a { color: #ff9a78; text-decoration: underline; }
        .message-text-part blockquote { margin: 12px 0; padding: 8px 14px; border-left: 3px solid #777; color: #bdbdbd; background: #202020; border-radius: 0 6px 6px 0; }
        .message-text-part hr { border: 0; border-top: 1px solid #4a4a4a; margin: 18px 0; }
        .markdown-table-wrap { overflow-x: auto; margin: 12px 0; }
        .markdown-table-wrap table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .markdown-table-wrap th, .markdown-table-wrap td { border: 1px solid #444; padding: 8px 10px; text-align: left; }
        .markdown-table-wrap th { background: #2d2d2d; font-weight: 700; }
        .markdown-table-wrap td { background: #222; }
        .message-text-part ul, .message-text-part ol { list-style-position: outside; }
        .message-text-part p { margin: 0 0 12px; }
        .message-text-part p:last-child { margin-bottom: 0; }
        .message-text-part ul, .message-text-part ol {
            margin: 8px 0 12px 22px;
            padding: 0;
        }
        .message-text-part li { margin: 4px 0; padding-left: 3px; }
        .message-text-part strong { font-weight: 700; color: inherit; }
        .message-text-part em { font-style: italic; }
        .message-text-part del { opacity: .8; }
        .message-text-part code.inline-code {
            background: #333;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 1px 5px;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: .9em;
        }
        .message-text-part h1, .message-text-part h2, .message-text-part h3 {
            margin: 16px 0 8px;
            line-height: 1.25;
        }
        .message-text-part h1 { font-size: 1.45em; }
        .message-text-part h2 { font-size: 1.25em; }
        .message-text-part h3 { font-size: 1.1em; }
        .message-text-part blockquote {
            border-left: 3px solid #555;
            margin: 10px 0;
            padding: 4px 12px;
            color: #bdbdbd;
        }

        .typing-indicator {
            display: none;
            align-items: center;
            gap: 8px;
            color: #808080;
            font-style: italic;
            padding: 16px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background-color: #808080;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            40% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .greeting {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            font-size: 32px;
            font-weight: 400;
            color: #fff;
        }

        .sun-icon {
            width: 32px;
            height: 32px;
            color: #ff6b35;
        }

        .search-container {
            width: 100%;
            max-width: 600px;
            position: relative;
            margin-bottom: 20px;
        }

        .chat-container .search-container {
            position: sticky;
            bottom: 0;
            background-color: #1a1a1a;
            padding: 20px 0;
            margin: 0;
            max-width: none;
        }

        .search-input {
            width: 100%;
            padding: 16px 120px 16px 16px;
            background-color: #262626;
            border: 1px solid #404040;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
            resize: none;
            min-height: 50px;
            max-height: 150px;
            font-family: inherit;
        }

        .search-input:focus {
            border-color: #ff6b35;
        }

        .search-input::placeholder {
            color: #808080;
        }

        .search-actions {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 4px;
        }

        .search-btn {
            padding: 8px;
            background: none;
            border: none;
            color: #808080;
            cursor: pointer;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .search-btn:hover {
            background-color: #404040;
        }

        .send-btn {
            padding: 8px;
            background-color: #ff6b35;
            border: none;
            color: white;
            cursor: pointer;
            border-radius: 6px;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            background-color: #e55a2b;
        }

        .send-btn:disabled {
            background-color: #404040;
            cursor: not-allowed;
        }

        .model-selector {
            align-self: flex-end;
            margin-bottom: 20px;
            margin-right: 60px;
        }

        .model-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            color: #b3b3b3;
            font-size: 14px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .model-btn:hover {
            background-color: #262626;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background-color: #262626;
            border: 1px solid #404040;
            border-radius: 8px;
            color: #e5e5e5;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .action-btn:hover {
            background-color: #333;
            border-color: #555;
            transform: translateY(-1px);
        }

        .action-icon {
            width: 16px;
            height: 16px;
            opacity: 0.8;
        }
        
        /* Artifact Canvas Styles */
        .artifact-canvas {
            background-color: #0d0d0d;
            border: 1px solid #404040;
            border-radius: 8px;
            margin: 16px;
            overflow: hidden;
        }

        .artifact-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #2a2a2a;
            padding: 8px 12px;
            border-bottom: 1px solid #404040;
        }

        .artifact-title {
            font-size: 13px;
            font-weight: 500;
            color: #b3b3b3;
        }

        .artifact-actions {
            display: flex;
            gap: 8px;
        }

        .artifact-btn {
            background: none;
            border: 1px solid #555;
            color: #b3b3b3;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .artifact-btn:hover {
            background-color: #404040;
            color: #fff;
        }
        
        .artifact-btn.view-btn {
            border-color: #4a90e2;
            color: #4a90e2;
        }
        .artifact-btn.view-btn:hover {
            background-color: #4a90e2;
            color: #fff;
        }

        .artifact-btn svg {
            width: 14px;
            height: 14px;
        }

        .artifact-code {
            padding: 12px;
            max-height: 400px;
            overflow: auto;
            scrollbar-width: thin;
            scrollbar-color: #404040 #1a1a1a;
        }
        
        .artifact-code pre {
            margin: 0;
        }

        .artifact-code code {
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            color: #e5e5e5;
            white-space: pre;
        }

        @media (max-width: 768px) {
            .container { position: relative; }
            .sidebar {
                position: fixed;
                z-index: 50;
                left: 0;
                top: 0;
                bottom: 0;
                width: min(82vw, 300px);
                transform: translateX(-100%);
                transition: transform .2s ease;
                box-shadow: 10px 0 30px rgba(0,0,0,.35);
            }
            .sidebar.mobile-open { transform: translateX(0); }
            .main-content { width: 100%; }
            .mobile-menu-btn { display: flex !important; }
            .greeting { font-size: 24px; text-align: center; }
            .welcome-screen { padding: 24px 16px; }
            .search-container { width: 100%; }
            .action-buttons { flex-direction: column; width: 100%; }
            .action-btn { justify-content: center; }
            .chat-header { padding: 12px 16px; }
            .chat-messages { padding: 16px; }
            .chat-input-container { padding: 10px 12px; }
        }

        @media (min-width: 769px) {
            .mobile-menu-btn { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu" style="display:none; position:fixed; top:14px; left:14px; z-index:60; border:0; border-radius:8px; padding:8px 10px; background:#2a2a2a; color:#fff; cursor:pointer;">☰</button>
        <div id="mobileOverlay" style="display:none; position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.45);"></div>
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg class="back-arrow" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                    </svg>
                    AI Assistant
                </div>
                <button class="new-chat-btn" id="newChatBtn">
                    <div class="plus-icon">+</div>
                    New chat
                </button>
            </div>
            
            <div class="sidebar-nav">
                <div class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1z"/>
                    </svg>
                    Chats
                </div>
                <div class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.11 0 2-.9 2-2V5c0-1.1-.89-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                    </svg>
                    Projects
                </div>
                <div class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                    </svg>
                    Artifacts
                </div>
            </div>
            
            <div class="sidebar-content">
                <div class="section-title">Recents</div>
                <div class="recent-items" id="recentItems">
                    <div class="empty-state" id="emptyState">
                        <span style="color: #666; font-size: 13px; font-style: italic;">No recent conversations</span>
                    </div>
                </div>
            </div>
            
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">U</div>
                    <div class="user-details">
                        <div class="user-name">User</div>
                        <div class="user-plan">Puter account</div>
                    </div>
                    <svg class="chevron-down" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
                    </svg>
                </div>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <div class="content-area">
                <!-- Welcome Screen -->
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="greeting">

                            <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
                        </svg>
                        Good morning, User
                    </div>
                    
                    <div class="search-container">
                        <textarea class="search-input" id="welcomeInput" placeholder="How can I help you today?" rows="1"></textarea>
                        <div class="search-actions">
                            <button class="search-btn" id="researchBtn">Research</button>
                            <button class="send-btn" id="sendBtn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>

                    <div style="max-width: 600px; margin-bottom: 15px; padding: 12px; background-color: #2a2a2a; border-radius: 8px; border: 1px solid #404040;">
                        <div style="font-size: 13px; color: #b3b3b3; text-align: center; margin-bottom: 10px;">
                            💡 <strong>First time?</strong> A small popup will appear for authentication - please allow it to enable AI access via Puter.js
                        </div>
                        <div style="font-size: 12px; color: #808080; text-align: center; margin-bottom: 10px;" id="protocolNotice">
                            <!-- This will be populated by JS -->
                        </div>
                        <div style="text-align: center;">
                            <button id="authButton" style="background-color: #ff6b35; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 12px;">
                                🔐 Authenticate with Puter
                            </button>
                        </div>
                    </div>
                    
                    <div class="model-selector">
                        <button class="model-btn" id="modelSelector">
                            <span id="currentModel">Sonnet 4</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
                            </svg>
                        </button>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="action-btn" data-prompt="Help me write">
                            <svg class="action-icon" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                            </svg>
                            Write
                        </button>
                        <button class="action-btn" data-prompt="Teach me about">
                            <svg class="action-icon" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6L23 9l-11-6zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"/>
                            </svg>
                            Learn
                        </button>
                        <button class="action-btn" data-prompt="Help me code">
                            <svg class="action-icon" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M9.4 16.6L4.8 12l4.6-4.6L8 6l-6 6 6 6 1.4-1.4zm5.2 0L19.2 12l-4.6-4.6L16 6l6 6-6 6-1.4-1.4z"/>
                            </svg>
                            Code
                        </button>
                        <button class="action-btn" data-prompt="Help me with daily tasks">
                            <svg class="action-icon" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                            </svg>
                            Life stuff
                        </button>
                        <button class="action-btn" data-prompt="Help me connect my apps">
                            <svg class="action-icon" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H6.99C4.79 7 3 8.79 3 11s1.79 4 4 4H11v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1H13V17h4.01c2.2 0 4-1.79 4-4s-1.8-4-4.01-4z"/>

                <!-- Chat Container -->
                <div class="chat-container" id="chatContainer">
                    <div class="chat-messages" id="chatMessages"></div>
                    
                    <div class="typing-indicator" id="typingIndicator">
                        <div class="message-avatar">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                            </svg>
                        </div>
                        <span>AI is typing</span>
                        <div class="typing-dots">
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                            <div class="typing-dot"></div>
                        </div>
                    </div>
                    
                    <div class="search-container">
                        <div class="attachment-bar" id="attachmentBar"></div>
                        <textarea class="search-input" id="chatInput" placeholder="Message AI..." rows="1"></textarea>
                        <div class="search-actions">
                            <input class="attachment-input" id="attachmentInput" type="file" multiple>
                            <button class="chat-attachment-btn" id="attachmentBtn" type="button" aria-label="Attach files" title="Attach files">
                                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                            </button>
                            <button class="model-btn" id="chatModelSelector" style="padding: 6px 8px; font-size: 12px;">
                                <span id="chatCurrentModel">Sonnet 4</span>
                            </button>
                            <button class="send-btn" id="chatSendBtn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>

                            </button>

    </div>

    <script>
        // App configuration
        const APP_NAME = 'AI Assistant';
        const USER_NAME = 'User';
        const USER_INITIAL = USER_NAME.charAt(0).toUpperCase();

        // Global state
        const availableModels = [
            { apiName: 'claude-sonnet-4', displayName: 'Claude Sonnet 4', shortName: 'Sonnet 4' },
            { apiName: 'claude-opus-4', displayName: 'Claude Opus 4', shortName: 'Opus 4' },
            { apiName: 'claude-3-7-sonnet', displayName: 'Claude 3.7 Sonnet', shortName: 'Sonnet 3.7' }
        ];
        let currentModel = availableModels[0].apiName;
        let chatHistory = [];
        let isStreaming = false;
        let recentConversations = [];
        let pendingAttachments = [];
        let currentConversationId = null;

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Initializing ' + APP_NAME + ' interface...');
            initializeInterface();
            updateModelDisplay();
            updateProtocolNotice();
        });

        function updateProtocolNotice() {
            const protocolNotice = document.getElementById('protocolNotice');
            if (protocolNotice) {
                if (window.location.protocol === 'file:') {
                    protocolNotice.innerHTML = '✅ <strong>File mode:</strong> Authentication should work perfectly here!';
                    protocolNotice.style.color = '#22c55e';
                } else if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                    protocolNotice.innerHTML = '⚠️ <strong>Server mode:</strong> If auth fails, browser profile issues are likely. See guide below.';
                    protocolNotice.style.color = '#f59e0b';
                } else {
                    protocolNotice.innerHTML = '🌐 <strong>Web mode:</strong> Make sure popups are allowed for this domain.';
                    protocolNotice.style.color = '#3b82f6';
                }
            }
        }

        async function handleManualAuth() {
            const authButton = document.getElementById('authButton');
            const researchBtn = document.getElementById('researchBtn');
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const mobileOverlay = document.getElementById('mobileOverlay');
            const authBox = authButton?.closest('div[style*="max-width: 600px"]');
            try {
                if (authButton) {
                    authButton.textContent = '🔄 Connecting...';
                    authButton.disabled = true;
                }
                if (typeof puter === 'undefined' || !puter.ai?.chat) {
                    throw new Error('Puter.js is not available.');
                }
                // A minimal request lets Puter open its authentication flow when needed.
                const response = await puter.ai.chat('Hello', { model: currentModel });
                if (response?.success === false) throw new Error('Authentication was not completed.');
                if (authButton) {
                    authButton.textContent = '✅ Connected';
                    authButton.style.backgroundColor = '#22c55e';
                }
                setTimeout(() => { if (authBox) authBox.style.display = 'none'; }, 800);
            } catch (error) {
                console.error('Authentication failed:', error);
                if (authButton) {
                    authButton.textContent = '🔐 Try again';
                    authButton.disabled = false;
                    authButton.style.backgroundColor = '#ff6b35';
                }
                alert('Authentication could not be completed. Please allow the Puter popup and try again.\n\n' + (error.message || 'Unknown error.'));
            }
        }

        function initializeInterface() {
            document.title = APP_NAME;
            document.querySelectorAll('.logo').forEach(el => {
                const arrow = el.querySelector('.back-arrow');
                el.textContent = '';
                if (arrow) el.appendChild(arrow);
                el.appendChild(document.createTextNode(APP_NAME));
            });
            const userName = document.querySelector('.user-name');
            const userAvatar = document.querySelector('.user-avatar');
            if (userName) userName.textContent = USER_NAME;
            if (userAvatar) userAvatar.textContent = USER_INITIAL;
            const greeting = document.querySelector('.greeting');
            if (greeting) {
                const svg = greeting.querySelector('.sun-icon');
                greeting.textContent = '';
                if (svg) greeting.appendChild(svg);
                greeting.appendChild(document.createTextNode('Good morning, ' + USER_NAME));
            }
            const welcomeInput = document.getElementById('welcomeInput');
            const chatInput = document.getElementById('chatInput');
            const sendBtn = document.getElementById('sendBtn');
            const chatSendBtn = document.getElementById('chatSendBtn');
            const newChatBtn = document.getElementById('newChatBtn');
            const actionBtns = document.querySelectorAll('.action-btn');
            const modelSelectors = document.querySelectorAll('#modelSelector, #chatModelSelector');
            const authButton = document.getElementById('authButton');

            if (authButton) authButton.addEventListener('click', handleManualAuth);

            [welcomeInput, chatInput].forEach(textarea => {
                if (textarea) {
                    textarea.addEventListener('input', () => autoResize(textarea));
                    textarea.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            if (textarea === welcomeInput) handleWelcomeMessage();
                            else handleChatMessage();
                        }
                    });
                }
            });

            if (sendBtn) sendBtn.addEventListener('click', handleWelcomeMessage);
            if (chatSendBtn) chatSendBtn.addEventListener('click', handleChatMessage);
            if (newChatBtn) newChatBtn.addEventListener('click', startNewChat);
            if (researchBtn) researchBtn.addEventListener('click', handleResearch);
            if (mobileMenuBtn) mobileMenuBtn.addEventListener('click', toggleMobileMenu);
            if (mobileOverlay) mobileOverlay.addEventListener('click', toggleMobileMenu);
            loadSavedConversations();

            actionBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const prompt = this.getAttribute('data-prompt');
                    if (prompt && welcomeInput) {
                        welcomeInput.value = prompt;
                        welcomeInput.focus();
                        autoResize(welcomeInput);
                    }
                });
            });

            modelSelectors.forEach(selector => {
                if (selector) selector.addEventListener('click', toggleModel);
            });

            if (welcomeInput) welcomeInput.focus();
            console.log('✅ Interface initialized');
        }

        function updateModelDisplay() {
            const model = availableModels.find(m => m.apiName === currentModel);
            if (!model) {
                console.error("Model not found in available models:", currentModel);
                return;
            }
            document.getElementById('currentModel').textContent = model.displayName;
            document.getElementById('chatCurrentModel').textContent = model.shortName;
        }

        function toggleModel(event) {
            event?.stopPropagation();
            const selector = event?.currentTarget || document.getElementById('modelSelector');
            let menu = document.getElementById('modelMenu');
            if (!menu) {
                menu = document.createElement('div');
                menu.id = 'modelMenu';
                menu.style.cssText = 'position:absolute; z-index:30; min-width:190px; background:#242424; border:1px solid #444; border-radius:10px; padding:6px; box-shadow:0 12px 30px rgba(0,0,0,.35);';
                availableModels.forEach(model => {
                    const option = document.createElement('button');
                    option.type = 'button';
                    option.textContent = model.displayName;
                    option.style.cssText = 'display:block; width:100%; text-align:left; background:none; color:#eee; border:0; padding:9px 10px; border-radius:7px; cursor:pointer;';
                    option.addEventListener('click', () => {
                        currentModel = model.apiName;
                        updateModelDisplay();
                        menu.remove();
                        saveConversations();
                    });
                    menu.appendChild(option);
                });
                document.body.appendChild(menu);
            }
            const rect = selector.getBoundingClientRect();
            menu.style.left = Math.max(8, rect.left) + 'px';
            menu.style.top = (rect.bottom + 6) + 'px';
            menu.style.display = 'block';
            setTimeout(() => {
                const closeMenu = (e) => {
                    if (!menu.contains(e.target) && e.target !== selector) {
                        menu.remove();
                        document.removeEventListener('click', closeMenu);
                    }
                };
                document.addEventListener('click', closeMenu);
            }, 0);
        }

        function toggleMobileMenu() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('mobileOverlay');
            const open = sidebar?.classList.toggle('mobile-open');
            if (overlay) overlay.style.display = open ? 'block' : 'none';
        }

        function handleResearch() {
            const input = document.getElementById('welcomeInput');
            if (!input || !input.value.trim() || isStreaming) {
                input?.focus();
                return;
            }
            const query = input.value.trim();
            input.value = 'Research: ' + query;
            autoResize(input);
            handleWelcomeMessage();
        }

        function saveConversations() {
            try {
                localStorage.setItem('aiAssistantConversations', JSON.stringify(recentConversations));
            } catch (e) { console.warn('Could not save conversations:', e); }
        }

        function loadSavedConversations() {
            try {
                const saved = JSON.parse(localStorage.getItem('aiAssistantConversations') || '[]');
                if (Array.isArray(saved)) {
                    recentConversations = saved.slice(0, 10);
                    updateRecentItems();
                }
            } catch (e) {
                recentConversations = [];
            }
        }

        async function handleWelcomeMessage() {
            const welcomeInput = document.getElementById('welcomeInput');
            const message = welcomeInput.value.trim();
            if (!message || isStreaming) return;
            console.log('📤 Sending welcome message:', message);
            createNewConversation(message);
            switchToChatView();
            await sendMessage(message);
        }

        async function handleChatMessage() {
            const chatInput = document.getElementById('chatInput');
            const message = chatInput.value.trim();
            if ((!message && !pendingAttachments.length) || isStreaming) return;
            console.log('📤 Sending chat message:', message);
            chatInput.value = '';
            autoResize(chatInput);
            await sendMessage(message);
        }

        function createNewConversation(firstMessage) {
            currentConversationId = 'conv_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            const title = firstMessage.length > 50 ? firstMessage.substring(0, 50) + '...' : firstMessage;
            const conversation = {
                id: currentConversationId,
                title: title,
                messages: [],
                timestamp: new Date(),
                model: currentModel
            };
            recentConversations.unshift(conversation);
            if (recentConversations.length > 10) {
                recentConversations = recentConversations.slice(0, 10);
            }
            updateRecentItems();
            saveConversations();
            console.log('📝 Created new conversation:', title);
        }

        function updateRecentItems() {
            const recentItemsContainer = document.getElementById('recentItems');
            recentItemsContainer.innerHTML = '';
            if (recentConversations.length === 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'empty-state';
                emptyDiv.innerHTML = '<span style="color: #666; font-size: 13px; font-style: italic;">No recent conversations</span>';
                recentItemsContainer.appendChild(emptyDiv);
            } else {
                recentConversations.forEach(conversation => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'recent-item';

                    const title = document.createElement('span');
                    title.textContent = conversation.title;
                    itemDiv.appendChild(title);

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-chat-btn';
                    deleteBtn.type = 'button';
                    deleteBtn.title = 'Delete chat';
                    deleteBtn.setAttribute('aria-label', 'Delete chat');
                    deleteBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-9 0 1 15h8l1-15M10 11v6m4-6v6"/></svg>';
                    deleteBtn.addEventListener('click', (event) => {
                        event.stopPropagation();
                        deleteConversation(conversation.id);
                    });
                    itemDiv.appendChild(deleteBtn);

                    itemDiv.addEventListener('click', () => loadConversation(conversation.id));
                    recentItemsContainer.appendChild(itemDiv);
                });
            }
        }

        async function deleteConversation(conversationId) {
            const conversation = recentConversations.find(conv => conv.id === conversationId);
            if (!conversation) return;
            if (!confirm(`Delete "${conversation.title}"? This cannot be undone.`)) return;

            // Best-effort cleanup of uploaded attachment files from Puter storage.
            try {
                if (typeof puter !== 'undefined' && puter.fs?.delete) {
                    const paths = [];
                    for (const message of (conversation.messages || [])) {
                        if (Array.isArray(message.content)) {
                            for (const part of message.content) {
                                if (part?.type === 'file' && part.puter_path) paths.push(part.puter_path);
                            }
                        }
                    }
                    for (const path of [...new Set(paths)]) {
                        try { await puter.fs.delete(path); } catch (_) {}
                    }
                }
            } catch (_) {}

            recentConversations = recentConversations.filter(conv => conv.id !== conversationId);
            saveConversations();

            if (currentConversationId === conversationId) {
                startNewChat();
            } else {
                updateRecentItems();
            }
        }

        function loadConversation(conversationId) {
            const conversation = recentConversations.find(conv => conv.id === conversationId);
            if (!conversation) return;
            currentConversationId = conversationId;
            chatHistory = [...conversation.messages];
            currentModel = conversation.model;
            updateModelDisplay();
            switchToChatView();
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = '';
            conversation.messages.forEach(msg => {
                addMessage(msg.content, msg.role);
            });
            document.getElementById('chatInput').focus();
            console.log('📂 Loaded conversation:', conversation.title);
        }

        function switchToChatView() {
            document.getElementById('welcomeScreen').style.display = 'none';
            document.getElementById('chatContainer').classList.add('active');
            console.log('🔄 Switched to chat view');
        }

        function startNewChat() {
            chatHistory = [];
            currentConversationId = null;
            
            // --- BUG FIX: Reset model to default on new chat ---
            currentModel = availableModels[0].apiName;
            updateModelDisplay();
            
            const welcomeScreen = document.getElementById('welcomeScreen');
            const chatContainer = document.getElementById('chatContainer');
            const chatMessages = document.getElementById('chatMessages');
            const welcomeInput = document.getElementById('welcomeInput');
            
            if (welcomeScreen) welcomeScreen.style.display = 'flex';
            if (chatContainer) chatContainer.classList.remove('active');
            if (chatMessages) chatMessages.innerHTML = '';
            pendingAttachments = [];
            renderAttachmentBar();
            if (welcomeInput) {
                welcomeInput.value = '';
                autoResize(welcomeInput);
                welcomeInput.focus();
            }
            autoResize(document.getElementById('chatInput'));
            
            console.log('🆕 Started new chat, model reset to default.');
        }

        async function sendMessage(message) {
            if (isStreaming) return;

            console.log('🚀 Starting to send message...');
            let userContent = message;

            // Upload selected attachments to Puter so the AI can receive them as file content.
            if (pendingAttachments.length) {
                if (typeof puter === 'undefined' || !puter.fs?.upload) {
                    addMessage('Attachments are unavailable because Puter file storage is not loaded.', 'assistant', true);
                    return;
                }
                try {
                    const uploaded = await puter.fs.upload(pendingAttachments.map(item => item.file));
                    const uploadedFiles = Array.isArray(uploaded) ? uploaded : (uploaded?.files || uploaded?.items || [uploaded]);
                    userContent = [
                        ...uploadedFiles.map((file, index) => ({
                            type: 'file',
                            puter_path: file.path || file.fullPath || file.name,
                            name: pendingAttachments[index]?.file?.name || file.name || 'Attachment'
                        })),
                        ...(message ? [{ type: 'text', text: message }] : [])
                    ];
                } catch (uploadError) {
                    addMessage('I could not upload the attachment: ' + (uploadError.message || 'Unknown error.'), 'assistant', true);
                    return;
                }
            }

            addMessage(userContent, 'user');
            pendingAttachments = [];
            renderAttachmentBar();
            showTypingIndicator();
            setInputState(false);

            chatHistory.push({ role: 'user', content: userContent });
            
            try {
                isStreaming = true;
                if (typeof puter === 'undefined') { throw new Error('Puter.js is not available.'); }
                console.log('📡 Calling Puter AI with model:', currentModel, 'and full history.');
                
                const response = await puter.ai.chat(chatHistory, {
                    model: currentModel,
                    stream: true
                });

                if (response && response.success === false) {
                    throw new Error('Authentication required. Please click the authenticate button and allow the popup.');
                }
                
                const { messageContent } = addMessage('', 'assistant');
                hideTypingIndicator();
                let fullResponse = '';
                
                for await (const part of response) {
                    if (part?.text) {
                        fullResponse += part.text;
                        renderFormattedMessage(fullResponse, messageContent);
                        scrollToBottom();
                    }
                }
                
                console.log('✅ Streaming complete.');
                renderFormattedMessage(fullResponse, messageContent); 
                
                chatHistory.push({ role: 'assistant', content: fullResponse });
                updateCurrentConversation();
                
            } catch (error) {
                console.error('❌ Error in sendMessage:', error);
                hideTypingIndicator();
                addMessage('Sorry, I encountered an error: ' + (error.message || 'Unknown error.'), 'assistant', true);
                
                // FIX: The API call failed, so the optimistic user message added to the history
                // resulted in an invalid state. Remove it to allow the user to try again.
                if (chatHistory.length > 0 && chatHistory[chatHistory.length - 1].role === 'user') {
                    chatHistory.pop();
                }

            } finally {
                isStreaming = false;
                setInputState(true);
                document.getElementById('chatInput')?.focus();
            }
        }

        function updateCurrentConversation() {
            if (!currentConversationId) return;
            const conversation = recentConversations.find(conv => conv.id === currentConversationId);
            if (conversation) {
                conversation.messages = [...chatHistory];
                conversation.timestamp = new Date();
                const index = recentConversations.indexOf(conversation);
                if (index > 0) {
                    recentConversations.splice(index, 1);
                    recentConversations.unshift(conversation);
                    updateRecentItems();
                }
                saveConversations();
            }
        }

        function addMessage(content, role, isError = false) {
            const chatMessages = document.getElementById('chatMessages');
            const messageId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            messageDiv.setAttribute('data-message-id', messageId);

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.innerHTML = role === 'user' ? USER_INITIAL : `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>`;

            const messageColumn = document.createElement('div');
            messageColumn.style.minWidth = '0';
            messageColumn.style.maxWidth = 'calc(100% - 48px)';
            messageColumn.style.width = 'min(100%, 760px)';

            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.dataset.rawContent = content || '';

            if (role === 'assistant') {
                renderFormattedMessage(content, messageContent);
            } else if (Array.isArray(content)) {
                const textPart = content.find(part => part?.type === 'text');
                const files = content.filter(part => part?.type === 'file');
                if (files.length) {
                    const attachmentWrap = document.createElement('div');
                    attachmentWrap.className = 'message-attachments';
                    files.forEach(file => {
                        const chip = document.createElement('div');
                        chip.className = 'message-attachment';
                        chip.innerHTML = '<span>📎</span>';
                        const name = document.createElement('span');
                        name.textContent = file.name || file.puter_path?.split('/').pop() || 'Attachment';
                        chip.appendChild(name);
                        attachmentWrap.appendChild(chip);
                    });
                    messageContent.appendChild(attachmentWrap);
                }
                if (textPart?.text) {
                    const text = document.createElement('div');
                    text.textContent = textPart.text;
                    messageContent.appendChild(text);
                }
            } else messageContent.textContent = content;

            if (isError) messageContent.style.color = '#ff6b6b';

            messageColumn.appendChild(messageContent);

            if (role === 'assistant' && !isError) {
                const actions = document.createElement('div');
                actions.className = 'assistant-actions';
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-response-btn';
                copyBtn.type = 'button';
                copyBtn.setAttribute('aria-label', 'Copy AI response');
                const copyIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1-.9 2-2 2H8V7h11v14z"/></svg>`;
                copyBtn.innerHTML = copyIcon + '<span>Copy</span>';
                copyBtn.addEventListener('click', async () => {
                    const text = messageContent.dataset.rawContent || '';
                    try {
                        await navigator.clipboard.writeText(text);
                    } catch {
                        const area = document.createElement('textarea');
                        area.value = text;
                        area.style.position = 'fixed';
                        area.style.opacity = '0';
                        document.body.appendChild(area);
                        area.select();
                        document.execCommand('copy');
                        area.remove();
                    }
                    copyBtn.innerHTML = copyIcon + '<span>Copied!</span>';
                    setTimeout(() => copyBtn.innerHTML = copyIcon + '<span>Copy</span>', 1500);
                });
                actions.appendChild(copyBtn);
                messageColumn.appendChild(actions);
            }

            messageDiv.appendChild(avatar);
            messageDiv.appendChild(messageColumn);
            chatMessages.appendChild(messageDiv);

            scrollToBottom();
            return { messageId, messageContent };
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatInlineMarkdown(text) {
            let html = escapeHtml(text);
            const stash = [];
            const save = value => {
                const token = `\u0000${stash.length}\u0000`;
                stash.push(value);
                return token;
            };

            // Protect inline code and links before other Markdown rules.
            html = html.replace(/`([^`\n]+)`/g, (_, code) =>
                save(`<code class="inline-code">${code}</code>`));

            html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, label, url) =>
                save(`<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`));

            // Strong + emphasis first, then simple emphasis.
            html = html.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
            html = html.replace(/___([^_\n]+)___/g, '<strong><em>$1</em></strong>');
            html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/__([^_\n]+)__/g, '<strong>$1</strong>');
            html = html.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
            html = html.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
            html = html.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>');

            return html.replace(/\u0000(\d+)\u0000/g, (_, index) => stash[Number(index)]);
        }

        function markdownToHtml(text) {
            const lines = String(text ?? '').replace(/\r\n?/g, '\n').split('\n');
            let html = '';
            let listType = null;
            let paragraph = [];
            let quoteLines = [];

            const closeList = () => {
                if (listType) {
                    html += `</${listType}>`;
                    listType = null;
                }
            };

            const flushParagraph = () => {
                if (!paragraph.length) return;
                const content = paragraph.map(line => formatInlineMarkdown(line)).join('<br>');
                html += `<p>${content}</p>`;
                paragraph = [];
            };

            const flushQuote = () => {
                if (!quoteLines.length) return;
                const content = quoteLines.map(line => formatInlineMarkdown(line)).join('<br>');
                html += `<blockquote>${content}</blockquote>`;
                quoteLines = [];
            };

            const isTableSeparator = line =>
                /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);

            const parseTableRow = line => {
                let value = line.trim();
                if (value.startsWith('|')) value = value.slice(1);
                if (value.endsWith('|')) value = value.slice(0, -1);
                return value.split('|').map(cell => cell.trim());
            };

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trimEnd();
                const trimmed = line.trim();
                const bullet = line.match(/^(\s*)[-*+]\s+(.*)$/);
                const ordered = line.match(/^(\s*)\d+[.)]\s+(.*)$/);
                const heading = line.match(/^\s*(#{1,6})\s+(.+)$/);
                const quote = line.match(/^\s*>\s?(.*)$/);

                // Tables: header row + separator row + data rows.
                if (i + 1 < lines.length && trimmed.includes('|') && isTableSeparator(lines[i + 1])) {
                    flushParagraph(); flushQuote(); closeList();
                    const headers = parseTableRow(line);
                    i += 1;
                    const rows = [];
                    while (i + 1 < lines.length && lines[i + 1].includes('|') && lines[i + 1].trim()) {
                        i++;
                        rows.push(parseTableRow(lines[i]));
                    }
                    html += '<div class="markdown-table-wrap"><table><thead><tr>';
                    headers.forEach(cell => html += `<th>${formatInlineMarkdown(cell)}</th>`);
                    html += '</tr></thead><tbody>';
                    rows.forEach(row => {
                        html += '<tr>';
                        for (let c = 0; c < headers.length; c++) {
                            html += `<td>${formatInlineMarkdown(row[c] ?? '')}</td>`;
                        }
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    continue;
                }

                if (!trimmed) {
                    const next = i + 1 < lines.length ? lines[i + 1] : '';
                    const nextOrdered = /^\s*\d+[.)]\s+/.test(next);
                    const nextBullet = /^\s*[-*+]\s+/.test(next);
                    if (listType && ((listType === 'ol' && nextOrdered) || (listType === 'ul' && nextBullet))) {
                        continue;
                    }
                    flushParagraph(); flushQuote(); closeList();
                    continue;
                }

                if (heading) {
                    flushParagraph(); flushQuote(); closeList();
                    const level = heading[1].length;
                    html += `<h${level}>${formatInlineMarkdown(heading[2])}</h${level}>`;
                    continue;
                }

                if (/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(line)) {
                    flushParagraph(); flushQuote(); closeList();
                    html += '<hr>';
                    continue;
                }

                if (quote) {
                    flushParagraph(); closeList();
                    quoteLines.push(quote[1]);
                    // Keep consecutive quote lines together.
                    const nextIsQuote = i + 1 < lines.length && /^\s*>/.test(lines[i + 1]);
                    if (!nextIsQuote) flushQuote();
                    continue;
                }

                if (bullet || ordered) {
                    flushParagraph(); flushQuote();
                    const match = bullet || ordered;
                    const type = bullet ? 'ul' : 'ol';
                    if (listType !== type) {
                        closeList();
                        html += `<${type}>`;
                        listType = type;
                    }
                    const indent = Math.floor((match[1] || '').length / 2);
                    html += `<li${indent ? ` class="nested-list-item" style="margin-left:${indent * 18}px"` : ''}>${formatInlineMarkdown(match[2])}</li>`;
                    continue;
                }

                closeList();
                flushQuote();
                paragraph.push(line);
            }

            flushParagraph();
            flushQuote();
            closeList();
            return html;
        }

        function renderFormattedMessage(content, container) {
            container.innerHTML = '';
            container.dataset.rawContent = content || '';
            if (!content) return;

            // Fenced code blocks are handled separately so they remain code artifacts.
            const codeBlockRegex = /```(?:([\w+#.-]+))?\s*\n([\s\S]*?)```/g;
            let lastIndex = 0;
            let match;

            while ((match = codeBlockRegex.exec(content)) !== null) {
                if (match.index > lastIndex) {
                    const textPart = document.createElement('div');
                    textPart.className = 'message-text-part';
                    textPart.innerHTML = markdownToHtml(content.slice(lastIndex, match.index));
                    container.appendChild(textPart);
                }

                const language = (match[1] || 'text').trim();
                container.appendChild(createArtifactCanvas(match[2].replace(/\n$/, ''), language));
                lastIndex = match.index + match[0].length;
            }

            if (lastIndex < content.length) {
                const textPart = document.createElement('div');
                textPart.className = 'message-text-part';
                textPart.innerHTML = markdownToHtml(content.slice(lastIndex));
                container.appendChild(textPart);
            }
        }

        function createArtifactCanvas(code, language) {
            const canvas = document.createElement('div');
            canvas.className = 'artifact-canvas';

            const header = document.createElement('div');
            header.className = 'artifact-header';
            
            const title = document.createElement('div');
            title.className = 'artifact-title';
            title.textContent = language ? `${language} code` : 'Code Artifact';
            
            const actions = document.createElement('div');
            actions.className = 'artifact-actions';

            if (language.toLowerCase() === 'html') {
                const viewBtn = document.createElement('button');
                viewBtn.className = 'artifact-btn view-btn';
                viewBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5C21.27 7.61 17 4.5 12 4.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg> View`;
                viewBtn.onclick = () => {
                    const blob = new Blob([code], { type: 'text/html' });
                    window.open(URL.createObjectURL(blob), '_blank');
                };
                actions.appendChild(viewBtn);
            }
            
            const copyBtn = document.createElement('button');
            copyBtn.className = 'artifact-btn';
            const copyIcon = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy`;
            copyBtn.innerHTML = copyIcon;
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(code).then(() => {
                    copyBtn.textContent = 'Copied!';
                    setTimeout(() => { copyBtn.innerHTML = copyIcon; }, 2000);
                });
            };

            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'artifact-btn';
            downloadBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg> Download`;
            downloadBtn.onclick = () => {
                const extensionMap = { javascript: 'js', python: 'py', html: 'html', css: 'css', json: 'json', java: 'java', csharp: 'cs', cpp: 'cpp', ruby: 'rb', go: 'go', rust: 'rs', shell: 'sh', bash: 'sh' };
                const extension = extensionMap[language.toLowerCase()] || 'txt';
                const filename = `claude-code.${extension}`;
                const blob = new Blob([code], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                a.click();
                a.remove();
            };

            actions.appendChild(copyBtn);
            actions.appendChild(downloadBtn);
            header.appendChild(title);
            header.appendChild(actions);

            const codeArea = document.createElement('div');
            codeArea.className = 'artifact-code';
            const pre = document.createElement('pre');
            const codeEl = document.createElement('code');
            codeEl.textContent = code;
            pre.appendChild(codeEl);
            codeArea.appendChild(pre);

            canvas.appendChild(header);
            canvas.appendChild(codeArea);

            return canvas;
        }

        function showTypingIndicator() {
            const typingIndicator = document.getElementById('typingIndicator');
            if (typingIndicator) {
                typingIndicator.style.display = 'flex';
                scrollToBottom();
            }
        }

        function hideTypingIndicator() {
            document.getElementById('typingIndicator').style.display = 'none';
        }

        function renderAttachmentBar() {
            const bar = document.getElementById('attachmentBar');
            if (!bar) return;
            bar.innerHTML = '';
            pendingAttachments.forEach((item, index) => {
                const chip = document.createElement('div');
                chip.className = 'attachment-chip';
                chip.innerHTML = '<span>📎</span>';
                const name = document.createElement('span');
                name.className = 'attachment-chip-name';
                name.textContent = item.file.name;
                chip.appendChild(name);
                const remove = document.createElement('button');
                remove.className = 'attachment-chip-remove';
                remove.type = 'button';
                remove.textContent = '×';
                remove.title = 'Remove attachment';
                remove.addEventListener('click', () => {
                    pendingAttachments.splice(index, 1);
                    renderAttachmentBar();
                });
                chip.appendChild(remove);
                bar.appendChild(chip);
            });
            bar.classList.toggle('has-files', pendingAttachments.length > 0);
        }

        function handleAttachmentSelection(event) {
            const files = Array.from(event.target.files || []);
            for (const file of files) {
                if (!pendingAttachments.some(item => item.file.name === file.name && item.file.size === file.size)) {
                    pendingAttachments.push({ file });
                }
            }
            renderAttachmentBar();
            event.target.value = '';
        }

        function setInputState(enabled) {
            const inputs = [
                document.getElementById('welcomeInput'),
                document.getElementById('chatInput'),
                document.getElementById('sendBtn'),
                document.getElementById('chatSendBtn')
            ];
            inputs.forEach(input => {
                if (input) {
                    input.disabled = !enabled;
                    input.style.opacity = enabled ? '1' : '0.6';
                }
            });
        }

        function scrollToBottom() {
            const chatMessages = document.getElementById('chatMessages');
            if (chatMessages) {
                requestAnimationFrame(() => {
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                });
            }
        }

        function autoResize(textarea) {
            if (!textarea) return;
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
        }

        document.getElementById('attachmentBtn')?.addEventListener('click', () => {
            document.getElementById('attachmentInput')?.click();
        });
        document.getElementById('attachmentInput')?.addEventListener('change', handleAttachmentSelection);
    </script>
</body>
</html>
